<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
</head>
<body>
    <script>

        const bookData = {
                            "Books":
                            [
                                {
                                    "title":"The Great Gatsby",
                                    "author":"F. Scott Fitzgerald",
                                    "publicationYear":"1925",
                                    "genres":["Fiction","Clasics"]
                                },
                                {    
                                
                                    "title":"To Kill a Mockingbird",
                                    "author":"Harper Lee",
                                    "publicationYear":"1960",
                                    "genres":["Fiction","Coming-of-Age"]

                                }
                            ]
                        };

            console.log("(a) Title of the first book:", bookData.Books[0].title);

            console.log("(b) Author of the second book:", bookData.Books[1].author);

            console.log("(c) Genres of all books:");
            bookData.Books.forEach((book, index) => {
                console.log(`- Book ${index + 1} (${book.title}) genres:`, book.genres.join(", "));
        });

    </script>
</body>
</html>
